[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lithon"
version = "0.1.0"
description = "Zero-dependency C++ execution engine and JIT compiler for Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lithon = "cli:main"  # Pointing to the main() entrypoint function inside cli.py

[tool.setuptools]
py-modules = ["cli", "main", "init"]
