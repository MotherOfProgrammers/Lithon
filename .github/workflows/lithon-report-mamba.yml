name: Lithon Mamba

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Lithon
        uses: actions/checkout@v4

      - name: Create Lithon Bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.LITHON_REPORTER_MAMBA_APP_ID }}
          private-key: ${{ secrets.LITHON_REPORTER_MAMBA_PKEY }}

      - name: Configure Git
        run: |
          git config user.name "Lithon Reporter Mamba"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build benchmark
        run: |
          g++ -std=c++20 -O2 -Isrc -o benchmark_fib \
            src/jit/benchmark_fib.cpp \
            src/interpreter/interpreter.cpp

      - name: Run benchmark
        run: |
          ./benchmark_fib | tee benchmark_output.txt

      - name: Save benchmark result
        run: |
          mkdir -p benchmarks/results
          cp benchmark_output.txt benchmarks/results/latest.txt

      - name: Show result
        run: |
          cat benchmarks/results/latest.txt
