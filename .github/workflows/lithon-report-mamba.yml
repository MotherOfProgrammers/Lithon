name: Lithon Mamba

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Lithon
        uses: actions/checkout@v4

      - name: Create Lithon Bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.LITHON_REPORTER_MAMBA_APP_ID }}
          private-key: ${{ secrets.LITHON_REPORTER_MAMBA_PKEY }}

      - name: Configure Git
        run: |
          git config user.name "Lithon Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify bot identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api /app
