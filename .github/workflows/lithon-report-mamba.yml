name: Lithon Mamba

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  bot:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'bot: update benchmark results')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Lithon
        uses: actions/checkout@v4

      - name: Create Lithon Bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.LITHON_REPORTER_MAMBA_APP_ID }}
          private-key: ${{ secrets.LITHON_REPORTER_MAMBA_PKEY }}

      - name: Configure Git
        run: |
          git config user.name "Lithon Reporter Mamba"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build benchmark
        run: |
          g++ -std=c++20 -O2 -Isrc -o benchmark_fib \
            src/jit/benchmark_fib.cpp \
            src/interpreter/interpreter.cpp

      - name: Run benchmark
        run: |
          ./benchmark_fib | tee benchmark_output.txt

      - name: Parse benchmark
        run: |
          mkdir -p benchmarks/results
          python3 mamba/parse_benchmark.py benchmark_output.txt

      - name: Add run metadata
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("benchmarks/results/latest.json")
          data = json.loads(path.read_text())

          data["commit"] = os.environ["GITHUB_SHA"]
          data["branch"] = os.environ["GITHUB_REF_NAME"]
          data["runner"] = os.environ["RUNNER_OS"]

          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Save benchmark history
        run: |
          mkdir -p benchmarks/results/history
          cp benchmarks/results/latest.json \
            "benchmarks/results/history/${GITHUB_SHA}.json"

      - name: Commit benchmark results
        run: |
          git add benchmarks/results
          git diff --cached --quiet || git commit -m "bot: update benchmark results"
          git push
