[project]
name = "bench-vid-maker"
version = "0.1.0"
description = "Reusable, clean-UI benchmark runner for recording side-by-side timing comparisons (e.g. CPython vs Lithon)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7",
    "pillow>=10.4",
    "psutil>=6.0",
]

[project.scripts]
bench-vid-maker = "bench_vid_maker.cli:main"
bench-vid-maker-all = "bench_vid_maker.batch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench_vid_maker"]
